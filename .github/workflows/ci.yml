name: CI

# develop is the release/base branch for this repo (public/develop on the
# snp-labs remote). main is intentionally NOT used.
#
# Trigger split (decided 2026-05 review):
#   pull_request       → PR-required jobs only (no audit, no integration-test).
#   push develop       → PR-required jobs + integration-test + audit.
#   workflow_dispatch  → PR-required jobs + integration-test + audit.
#   schedule (daily)   → audit only (CVE drift gate).
on:
  # NOTE — no workflow-level `paths-ignore`. branch protection requires
  # `ci-summary` to report a result on every PR; if path filtering causes
  # the workflow to be skipped, the required check stays Pending and the
  # PR cannot merge. Docs-only PRs therefore still trigger this workflow,
  # and ci-summary closes the loop. Future optimisation should use
  # job-level `if:` to skip heavy steps while keeping ci-summary green —
  # never workflow-level path filtering.
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
  schedule:
    # 06:23 UTC daily — audit runs alone; every other job is gated off
    # via `if: github.event_name != 'schedule'`.
    - cron: '23 6 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel duplicate runs on PRs; preserve completion of develop push runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # PR-required jobs (also run on develop push + workflow_dispatch).
  # ───────────────────────────────────────────────────────────────────────────

  fmt:
    name: Format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-fmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (workspace, release-tests profile)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-test
          install-nextest: "true"
      # `[profile.release]` uses `panic = "abort"` for mobile binary size.
      # Cargo cannot propagate that to test binaries (test harness needs
      # unwind), so `cargo test --release` fails on a panic-strategy
      # mismatch. The workspace defines `[profile.release-tests]`
      # (release-opt + `panic = "unwind"`, `lto = false`) for this case;
      # nextest's `--cargo-profile release-tests` selects it.
      - run: cargo nextest run --profile ci --cargo-profile release-tests --workspace --locked

  build-release:
    name: Build (release profile)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-build-release
      # Distinct from `test`: this exercises the actual `panic=abort, lto=true`
      # profile the release path will ship. Catches release-profile-only
      # regressions (LTO-induced symbol resolution, panic=abort codegen, etc.).
      - run: cargo build --release --workspace --locked

  feature-matrix:
    name: Feature matrix
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-feature-matrix
      # Only feature combinations that actually exist in this workspace
      # (see each crate's `[features]` block). Defaults are covered by
      # `clippy`, so this leg only adds non-default permutations.
      - name: ark-codec | no-default
        run: cargo check -p ark-codec --no-default-features --locked
      - name: ark-codec | field-serde
        run: cargo check -p ark-codec --no-default-features --features field-serde --locked
      - name: ark-r1cs-helpers | default
        run: cargo check -p ark-r1cs-helpers --locked
      - name: gadget | crypto
        run: cargo check -p gadget --features crypto --locked
      - name: gadget | crypto,base64
        run: cargo check -p gadget --features crypto,base64 --locked
      - name: gadget | crypto,base64,rsa,hashes-sha256
        run: cargo check -p gadget --features crypto,base64,rsa,hashes-sha256 --locked
      - name: gadget | full
        run: cargo check -p gadget --features full --locked
      - name: zkap-service | default
        run: cargo check -p zkap-service --locked
      - name: zkap-service | testing
        run: cargo check -p zkap-service --features testing --locked
      - name: circuit | integration-tests
        run: cargo check -p circuit --features integration-tests --locked

  rustdoc:
    name: Rustdoc
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-rustdoc
      # Workspace-wide `missing_docs = "warn"` + `-D warnings` here gates
      # every regression that Phase 7/8/9 cleanup paid down.
      - run: cargo doc --workspace --no-deps --locked

  wasm-build-smoke:
    name: WASM build smoke (wasm32-unknown-unknown)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-wasm-build-smoke
      # rust-toolchain.toml already lists wasm32-unknown-unknown; the
      # composite action installs it during setup. `.cargo/config.toml`
      # supplies `+simd128,+bulk-memory` for the wasm32 target.
      - run: cargo build -p zkap-witness-gen-wasm --target wasm32-unknown-unknown --release --locked

  generate-setup-smoke:
    name: generate_setup smoke (example.json bundle)
    if: github.event_name != 'schedule'
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: generate-setup-smoke-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-generate-setup-smoke
      - name: Run generate_setup against example.json
        # `example.json` is the small smoke config (n=6, k=3, tree_height=4)
        # — full setup completes in a few minutes on the standard runner.
        # `circuit/integration-tests` opens the test-only setup path that
        # generate_setup needs.
        run: |
          mkdir -p /tmp/ci-crs
          cargo run --release -p zkap-cli --bin generate_setup \
            --features circuit/integration-tests --locked -- \
            --config example.json \
            --output /tmp/ci-crs \
            --circuit-id zkap-ci-smoke
      - name: Verify 7-file post-migration bundle layout
        run: bash scripts/check-bundle-layout.sh /tmp/ci-crs
      - name: Enforce 2 GiB bundle size cap
        run: bash scripts/ci/check-crs-size-cap.sh /tmp/ci-crs

  migration-boundary:
    name: Migration boundary scripts
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install ripgrep (required by check-removed-api.sh)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: scripts/check-removed-api.sh
        run: bash scripts/check-removed-api.sh
      - name: scripts/check-bundle-layout.sh syntax check
        run: bash -n scripts/check-bundle-layout.sh
      - name: scripts/ci/check-crs-size-cap.sh syntax check
        run: bash -n scripts/ci/check-crs-size-cap.sh
      - name: scripts/release/sha256sums.sh syntax check
        run: bash -n scripts/release/sha256sums.sh

  # ───────────────────────────────────────────────────────────────────────────
  # develop-push / workflow_dispatch only (skipped on PR by design).
  # ───────────────────────────────────────────────────────────────────────────

  integration-test:
    name: Integration test (Groth16 prove/verify)
    # PR skips this (decision D4 in design review). Plain `--workspace`
    # silently misses it because the target has
    # `required-features = ["integration-tests"]`.
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-integration-test
          install-nextest: "true"
      - run: |
          cargo nextest run --profile ci --cargo-profile release-tests \
            -p circuit --features integration-tests \
            --test groth16_integration --locked

  # ───────────────────────────────────────────────────────────────────────────
  # develop-push / schedule / workflow_dispatch only (decision D5).
  # Permissions intentionally remain `contents: read` (decision D6 — audit
  # does NOT file GitHub issues).
  # ───────────────────────────────────────────────────────────────────────────

  audit:
    name: Security audit (cargo-audit)
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-audit
          install-cargo-audit: "true"
      # cargo-audit picks up `.cargo/audit.toml` automatically; the repo
      # already documents every ignored advisory there.
      - run: cargo audit --deny warnings

  # ───────────────────────────────────────────────────────────────────────────
  # ci-summary — single required check for branch protection (decision D8).
  # Audit is intentionally NOT a dependency: it has different trigger
  # conditions and runs as an informational gate after merge.
  # ───────────────────────────────────────────────────────────────────────────

  ci-summary:
    name: CI summary
    if: always() && github.event_name != 'schedule'
    needs:
      - fmt
      - clippy
      - test
      - build-release
      - feature-matrix
      - rustdoc
      - wasm-build-smoke
      - generate-setup-smoke
      - migration-boundary
      - integration-test
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required-job results
        # `integration-test` is intentionally `skipped` on PR — that is OK.
        # Fail only on `failure` or `cancelled` so branch protection sees a
        # red ci-summary if and only if a required gate actually broke.
        run: |
          set -euo pipefail
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -E '"result":[[:space:]]*"(failure|cancelled)"'; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required CI jobs succeeded or were intentionally skipped."
