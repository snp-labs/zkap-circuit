name: Release

# Triggered by:
#   * tag push matching vX.Y.Z (stable) or vX.Y.Z-rc.N (RC).
#   * workflow_dispatch — only valid from refs/heads/develop (enforced in
#     `validate`). Stable releases require a tag commit reachable from
#     origin/develop.
#
# develop is the repo's base/release branch (public/develop remote). main is
# intentionally NOT used as a release base.
on:
  # GitHub's `tags:` filter is glob, NOT regex — so the strict SemVer +
  # RC shape (`v[0-9]+.[0-9]+.[0-9]+(-rc.[0-9]+)?`) cannot be expressed
  # safely here. Match broadly with `v*`, and let the `validate` job
  # below enforce the real grammar via `^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$`.
  # An off-shape tag (e.g. `vfoo`, `v1.2`, `v1.2.3-beta.1`) reaches the
  # workflow but fails validate immediately, without producing partial
  # release assets.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3 or 1.2.3-rc.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # validate — gate before anything builds.
  # Enforces (in order):
  #   1. workflow_dispatch must be from refs/heads/develop.
  #   2. version string parses as stable or RC semver.
  #   3. tag commit (push only) is reachable from origin/develop
  #      (via the snp-labs `public` remote).
  #   4. parsed version matches crates/cli/Cargo.toml.
  #   5. SOURCE_DATE_EPOCH pinned to the commit timestamp for reproducibility.
  # ───────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
      source_date_epoch: ${{ steps.parse.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history is needed for `git merge-base --is-ancestor`
          # against origin/develop.
          fetch-depth: 0

      - name: Enforce develop-only workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::workflow_dispatch must be invoked from refs/heads/develop (got: $GITHUB_REF)"
            exit 1
          fi
          echo "workflow_dispatch is on refs/heads/develop — OK"

      - name: Parse + validate version
        id: parse
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          if printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            IS_PRERELEASE=true
          elif printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            IS_PRERELEASE=false
          else
            echo "::error::Invalid version format: '$VERSION' (expected X.Y.Z or X.Y.Z-rc.N)"
            exit 1
          fi

          # Reproducible-build epoch from the tagged commit.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)

          {
            echo "version=$VERSION"
            echo "is_prerelease=$IS_PRERELEASE"
            echo "source_date_epoch=$SOURCE_DATE_EPOCH"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VERSION  is_prerelease=$IS_PRERELEASE  source_date_epoch=$SOURCE_DATE_EPOCH"

      - name: Verify tag commit is in develop (tag push only)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # `actions/checkout` fetches the tag commit but not necessarily
          # the develop branch — fetch it explicitly into a local ref so
          # ancestry can be checked.
          git fetch --quiet --no-tags origin develop:refs/remotes/origin/develop
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/develop; then
            echo "::error::Tag commit $GITHUB_SHA is NOT reachable from origin/develop. Release branch policy requires develop ancestry."
            exit 1
          fi
          echo "Tag commit $GITHUB_SHA is in origin/develop — OK"

      - name: Verify crates/cli/Cargo.toml version matches release version
        run: |
          set -euo pipefail
          VERSION="${{ steps.parse.outputs.version }}"
          # crates/cli/Cargo.toml has a single top-level `version = "x.y.z"`
          # line; workspace deps use `workspace = true` (no inline version).
          CARGO_VERSION=$(awk -F'"' '/^version[[:space:]]*=/ {print $2; exit}' crates/cli/Cargo.toml)
          if [ -z "$CARGO_VERSION" ]; then
            echo "::error::Could not extract version from crates/cli/Cargo.toml"
            exit 1
          fi
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Release version ($VERSION) does not match crates/cli/Cargo.toml version ($CARGO_VERSION). Bump the Cargo.toml before tagging."
            exit 1
          fi
          echo "Release version matches crates/cli/Cargo.toml ($VERSION)"

  # ───────────────────────────────────────────────────────────────────────────
  # test-full — re-run clippy + nextest at the tag commit so the release
  # gate is independent of the merge-time CI run.
  # ───────────────────────────────────────────────────────────────────────────
  test-full:
    name: Test (full, tag commit)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-test
          install-nextest: "true"
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --profile ci --cargo-profile release-tests --workspace --locked
      - run: |
          cargo nextest run --profile ci --cargo-profile release-tests \
            -p circuit --features integration-tests \
            --test groth16_integration --locked

  # ───────────────────────────────────────────────────────────────────────────
  # workspace-build — exercise the real `[profile.release]` (panic=abort,
  # lto=true) build path that downstream binaries ship.
  # ───────────────────────────────────────────────────────────────────────────
  workspace-build:
    name: Build workspace (release profile)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-workspace-build
      - run: cargo build --release --workspace --locked

  # ───────────────────────────────────────────────────────────────────────────
  # build-cli — produce generate_setup + generate_hash for upload.
  # ───────────────────────────────────────────────────────────────────────────
  build-cli:
    name: Build zkap-cli binaries
    needs: [validate, test-full, workspace-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-build-cli
      - name: Build zkap-cli (release)
        # `circuit/integration-tests` enables the setup code path that
        # generate_setup needs at runtime — same flag CI's
        # generate-setup-smoke uses.
        run: |
          cargo build --release -p zkap-cli \
            --features circuit/integration-tests --locked
      - name: Stage CLI artifacts
        run: |
          set -euo pipefail
          mkdir -p stage-cli
          cp target/release/generate_setup              stage-cli/generate_setup
          cp target/release/generate_hash               stage-cli/generate_hash
          # Phase 3: the witness-gen sidecar generator is built here and
          # consumed by the `publish-witness-gen` job.
          cp target/release/generate_witness_gen_sidecar stage-cli/generate_witness_gen_sidecar
          ls -la stage-cli
      - name: Upload CLI artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zkap-cli
          path: stage-cli/
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # build-wasm — wasm32 cdylib, optional wasm-opt.
  # ───────────────────────────────────────────────────────────────────────────
  build-wasm:
    name: Build witness_gen.wasm
    needs: [validate, test-full, workspace-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-build-wasm
      - name: Install wasm-opt (binaryen)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: wasm-opt version
        run: wasm-opt --version
      - name: Build + optimise wasm
        run: bash scripts/ci/build-wasm-artifact.sh stage-wasm/witness_gen.wasm
      - name: Upload wasm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zkap-witness-wasm
          path: stage-wasm/
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # generate-release-bundle — per-shape CRS bundle.
  # Runs `generate_setup` for each shape; on stable releases also signs
  # `manifest.json` using the GitHub `release` environment's
  # MANIFEST_SIGNING_KEY (base64-encoded raw 32-byte Ed25519 seed).
  # ───────────────────────────────────────────────────────────────────────────
  generate-release-bundle:
    name: Generate release bundle (${{ matrix.shape }})
    needs: [validate, test-full, workspace-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # `release` GitHub Environment hosts MANIFEST_SIGNING_KEY and is where
    # any required-reviewer policy lives. RC releases neither read the
    # secret nor need approval gating, so the environment binding is
    # applied *only* for stable releases. Evaluating to an empty string
    # makes GitHub skip the environment binding entirely (no protection
    # rules, no secret exposure).
    environment: ${{ needs.validate.outputs.is_prerelease == 'false' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        shape:
          - 1-of-1
          - 3-of-3
    concurrency:
      group: generate-release-bundle-${{ github.ref }}-${{ matrix.shape }}
      cancel-in-progress: false
    env:
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-generate-bundle

      - name: Prepare signing key (stable releases only)
        if: needs.validate.outputs.is_prerelease == 'false'
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MANIFEST_SIGNING_KEY:-}" ]; then
            echo "::error::MANIFEST_SIGNING_KEY secret missing in 'release' environment (required for stable releases)"
            exit 1
          fi
          KEY_FILE="$(mktemp)"
          printf '%s' "$MANIFEST_SIGNING_KEY" | base64 -d > "$KEY_FILE"
          SZ=$(wc -c < "$KEY_FILE" | tr -d ' ')
          if [ "$SZ" != "32" ]; then
            echo "::error::Decoded signing key is $SZ bytes; expected 32 (raw Ed25519 seed)"
            shred -u "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"
            exit 1
          fi
          echo "SIGNING_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "Signing key staged (32-byte Ed25519 seed)"

      - name: Generate CRS bundle
        run: |
          set -euo pipefail
          mkdir -p output/keys
          SIGNING_ARGS=()
          if [ -n "${SIGNING_KEY_FILE:-}" ]; then
            SIGNING_ARGS=(--signing-key "$SIGNING_KEY_FILE")
          fi
          # Phase 3: no --witness-gen-wasm — the CRS bundle is the 7-file
          # set only; witness_gen.wasm ships in its own witness-gen-v<ver>
          # release (see publish-witness-gen).
          cargo run --release -p zkap-cli --bin generate_setup \
            --features circuit/integration-tests --locked -- \
            --config configs/release/${{ matrix.shape }}.json \
            --output output/keys \
            --circuit-id zkap-main-${{ matrix.shape }} \
            "${SIGNING_ARGS[@]}"

      - name: Always cleanup signing key
        if: always() && env.SIGNING_KEY_FILE != ''
        run: |
          shred -u "$SIGNING_KEY_FILE" 2>/dev/null || rm -f "$SIGNING_KEY_FILE"

      - name: Verify 7-file post-migration bundle layout
        run: bash scripts/check-bundle-layout.sh output/keys

      - name: Enforce 2 GiB bundle size cap
        run: bash scripts/ci/check-crs-size-cap.sh output/keys

      - name: Write per-bundle SHA256SUMS
        # Bundle-internal checksum manifest. Restricted to the canonical
        # 7-file set (+ optional .sig) — not a glob of the whole directory.
        run: |
          set -euo pipefail
          FILES=(
            output/keys/circuit.ar1cs
            output/keys/pk.bin
            output/keys/vk.bin
            output/keys/pvk.bin
            output/keys/Groth16Verifier.sol
            output/keys/config.json
            output/keys/manifest.json
          )
          if [ -f output/keys/manifest.json.sig ]; then
            FILES+=(output/keys/manifest.json.sig)
          fi
          bash scripts/release/sha256sums.sh --files output/keys/SHA256SUMS "${FILES[@]}"
          cat output/keys/SHA256SUMS

      - name: Upload bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proving-keys-${{ matrix.shape }}
          path: output/keys/
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # solidity-smoke — smoke-compile the emitted Groth16Verifier.sol.
  # Pulls the 1-of-1 shape (representative; 3-of-3 differs only in public
  # input shape and uses the same emit path).
  # ───────────────────────────────────────────────────────────────────────────
  solidity-smoke:
    name: Solidity verifier smoke compile
    needs: generate-release-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download 1-of-1 bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: proving-keys-1-of-1
          path: dl/1-of-1
      - name: Install solc-js
        run: npm install --global solc@0.8.30
      - name: solcjs --bin
        run: solcjs --bin dl/1-of-1/Groth16Verifier.sol

  # ───────────────────────────────────────────────────────────────────────────
  # wasm-parity — the wasm32 witness generator must produce byte-identical
  # output to the native rlib path on the toy k=1/k=3/k=5 fixtures. Combined
  # with r1cs-preflight (rlib output satisfies the real per-shape R1CS), this
  # transitively backs the sidecar's compatibility claim. Shape-agnostic: a
  # single shared wasm covers every shape, so this is not a matrix job.
  #
  # NOTE: scripts/ci/run-wasm-parity.sh still bundles a wasm copy for ci.yml's
  # legacy generate-setup-smoke; we invoke the parity tests directly here so the
  # release path needs no bundled wasm.
  # ───────────────────────────────────────────────────────────────────────────
  wasm-parity:
    name: WASM/rlib witness parity
    needs: [build-wasm]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-wasm-parity
      - name: Download wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zkap-witness-wasm
          path: target/wasm32-unknown-unknown/release/
      - name: Mirror to wasm_artifact_path() canonical filename
        # wasm_artifact_path() (crates/witness-gen-wasm/benches/common/mod.rs)
        # is hardcoded to zkap_witness_gen_wasm.wasm (cargo cdylib output name).
        run: cp target/wasm32-unknown-unknown/release/witness_gen.wasm target/wasm32-unknown-unknown/release/zkap_witness_gen_wasm.wasm
      - name: Parity (wasm vs native rlib, k1/k3/k5)
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          cargo test --release -p zkap-witness-gen-wasm --test parity --locked -- \
            --ignored --exact parity_k1 parity_k3 parity_k5 2>&1 | tee "$LOG"
          if ! grep -qE 'test result: ok\. 3 passed' "$LOG"; then
            echo "::error::parity did not report '3 passed' — investigate silent-skip or test rename" >&2
            exit 1
          fi
          echo "Parity OK: parity_k1, parity_k3, parity_k5 passed"

  # ───────────────────────────────────────────────────────────────────────────
  # r1cs-preflight (H1 gate) — for EACH shape, the witness generator's rlib
  # output must form a satisfying assignment for that shape's real circuit.ar1cs
  # (verified by running the Groth16 prover end-to-end). This gates the sidecar's
  # compatible_ar1cs_blake3: a shape's ar1cs_blake3 is only advertised after its
  # preflight passes. Reuses the per-shape bundle from generate-release-bundle
  # (no second generate_setup); stages a proof_fixture.json with gen_proof_fixture,
  # then runs the preflight against the bundle via ZKAP_PREFLIGHT_BUNDLE_DIR.
  # ───────────────────────────────────────────────────────────────────────────
  r1cs-preflight:
    name: R1CS preflight (${{ matrix.shape }})
    needs: [validate, generate-release-bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shape:
          - 1-of-1
          - 3-of-3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-r1cs-preflight
      - name: Download ${{ matrix.shape }} bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: proving-keys-${{ matrix.shape }}
          path: bundle
      - name: Stage proof_fixture.json
        run: |
          set -euo pipefail
          ZKAP_PROOF_MANIFEST_DIR="$PWD/bundle" \
            cargo test --release -p zkap-service --test gen_proof_fixture --locked -- \
            --ignored --nocapture
      - name: Preflight (rlib witness satisfies real circuit.ar1cs + Groth16 prove)
        run: |
          set -euo pipefail
          ZKAP_PREFLIGHT_BUNDLE_DIR="$PWD/bundle" \
            cargo test --release -p zkap-witness-gen-wasm --test r1cs_preflight --locked -- \
            --ignored --nocapture

  # ───────────────────────────────────────────────────────────────────────────
  # publish-release — CRS-only GitHub Release (one of two `contents: write`
  # jobs; the other is publish-witness-gen). Stages every asset with
  # shape-prefixed names, writes a top-level SHA256SUMS over the *exact* asset
  # list, and creates the GitHub Release with that explicit list (no globs).
  # ───────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs:
      - validate
      - test-full
      - workspace-build
      - build-cli
      - generate-release-bundle
      - solidity-smoke
      - wasm-parity
      - r1cs-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dl

      - name: Stage release assets (explicit names, no globs)
        id: stage
        env:
          IS_PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          mkdir -p release
          # Common assets — keep canonical names. (No witness_gen.wasm:
          # Phase 3 ships it in the separate witness-gen-v<ver> release.)
          cp dl/zkap-cli/generate_setup       release/generate_setup
          cp dl/zkap-cli/generate_hash        release/generate_hash

          # Per-shape assets — prefix with the shape so 1-of-1 and 3-of-3
          # never collide on the Release page.
          PER_SHAPE_REQUIRED=(
            circuit.ar1cs
            pk.bin
            vk.bin
            pvk.bin
            Groth16Verifier.sol
            config.json
            manifest.json
            SHA256SUMS
          )
          for shape in 1-of-1 3-of-3; do
            for f in "${PER_SHAPE_REQUIRED[@]}"; do
              src="dl/proving-keys-${shape}/${f}"
              if [ ! -f "$src" ]; then
                echo "::error::missing required asset: $src"
                exit 1
              fi
              cp "$src" "release/${shape}-${f}"
            done
            # Signature exists only for stable releases (decision D11).
            sigsrc="dl/proving-keys-${shape}/manifest.json.sig"
            if [ "$IS_PRERELEASE" = "false" ]; then
              if [ ! -f "$sigsrc" ]; then
                echo "::error::stable release missing $sigsrc"
                exit 1
              fi
              cp "$sigsrc" "release/${shape}-manifest.json.sig"
            elif [ -f "$sigsrc" ]; then
              echo "::error::RC release should not carry $sigsrc — refusing to upload"
              exit 1
            fi
          done

          ls -la release

      - name: Write top-level SHA256SUMS
        run: |
          set -euo pipefail
          # Hash every staged asset *except* the SHA256SUMS file itself.
          MAPFILE_INPUTS=()
          while IFS= read -r f; do
            MAPFILE_INPUTS+=("$f")
          done < <(find release -maxdepth 1 -type f ! -name SHA256SUMS | LC_ALL=C sort)
          bash scripts/release/sha256sums.sh --files release/SHA256SUMS "${MAPFILE_INPUTS[@]}"
          echo "------- top-level SHA256SUMS -------"
          cat release/SHA256SUMS

      - name: Assert CRS release carries no witness_gen.wasm
        run: |
          set -euo pipefail
          # Phase 3: the witness generator ships in its own
          # witness-gen-v<ver> release, never in the CRS release.
          found=$(find release -maxdepth 1 -name '*witness_gen.wasm' | LC_ALL=C sort)
          if [ -n "$found" ]; then
            echo "::error::CRS release must not carry any witness_gen.wasm:" >&2
            printf '%s\n' "$found" >&2
            exit 1
          fi
          echo "OK: no witness_gen.wasm in CRS release (shipped as witness-gen-v<ver>)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          IS_PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          PRE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRE_FLAG="--prerelease"
          fi

          # Explicit asset list — built from the staged directory, sorted,
          # and printed for the audit log. No bare globs handed to `gh`.
          ASSETS=()
          while IFS= read -r f; do
            ASSETS+=("$f")
          done < <(find release -maxdepth 1 -type f | LC_ALL=C sort)

          echo "Uploading ${#ASSETS[@]} assets to v${VERSION}:"
          printf '  %s\n' "${ASSETS[@]}"

          NOTES="Automated release of zkap-circuit v${VERSION} (CRS only).

          Asset integrity is recorded in the top-level SHA256SUMS.
          Each per-shape bundle additionally carries its own
          \`<shape>-SHA256SUMS\` over the canonical 7-file CRS layout.
          Stable releases include \`<shape>-manifest.json.sig\`
          (Ed25519 over manifest.json).

          The witness generator (witness_gen.wasm) ships separately in the
          companion \`witness-gen-v${VERSION}\` release; pair it with this CRS
          using its \`compatible_ar1cs_blake3\` sidecar."

          gh release create "v${VERSION}" $PRE_FLAG \
            --title "v${VERSION}" \
            --notes "$NOTES" \
            "${ASSETS[@]}"

  # ───────────────────────────────────────────────────────────────────────────
  # publish-witness-gen — companion witness-gen release, published in the SAME
  # run but under a separate `witness-gen-v<ver>` tag. Carries witness_gen.wasm
  # + the witness_gen.json sidecar (sha256 + compatible_ar1cs_blake3). The
  # compatible list is collected by generate_witness_gen_sidecar from the
  # per-shape bundle manifests that already passed the r1cs-preflight gate (H1).
  #
  # The `witness-gen-v*` tag is created with the repository GITHUB_TOKEN, which
  # by design does not trigger other workflows; and it does not match the `v*`
  # push-trigger glob, so this never re-triggers a release. (A dedicated
  # witness-only re-publish workflow is intentionally deferred — see plan §4.)
  # ───────────────────────────────────────────────────────────────────────────
  publish-witness-gen:
    name: Publish witness-gen release
    needs:
      - validate
      - build-cli
      - build-wasm
      - generate-release-bundle
      - wasm-parity
      - r1cs-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dl

      - name: Generate witness_gen.json sidecar
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x dl/zkap-cli/generate_witness_gen_sidecar
          dl/zkap-cli/generate_witness_gen_sidecar \
            --witness-gen-wasm dl/zkap-witness-wasm/witness_gen.wasm \
            --version "v${VERSION}" \
            --bundle dl/proving-keys-1-of-1 \
            --bundle dl/proving-keys-3-of-3 \
            --circuit-commit "$GITHUB_SHA" \
            --circuit-id zkap-main \
            --output witness_gen.json
          echo "------- witness_gen.json -------"
          cat witness_gen.json

      - name: Create witness-gen GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          IS_PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          PRE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRE_FLAG="--prerelease"
          fi

          NOTES="Independent witness generator for zkap-circuit v${VERSION}.

          Contents:
            * witness_gen.wasm — shape-agnostic witness generator (wasm32 cdylib).
            * witness_gen.json — sidecar: sha256(wasm) + compatible_ar1cs_blake3,
              the ar1cs_blake3 of every CRS shape this wasm was R1CS-preflighted
              against. The CRS itself ships under the v${VERSION} release.

          Pairing is keyed on ar1cs_blake3, not the version string: a witness-gen
          release may be re-published independently of the CRS."

          gh release create "witness-gen-v${VERSION}" $PRE_FLAG \
            --target "$GITHUB_SHA" \
            --title "witness-gen-v${VERSION}" \
            --notes "$NOTES" \
            dl/zkap-witness-wasm/witness_gen.wasm \
            witness_gen.json
