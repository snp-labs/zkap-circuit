[package]
name = "zkap-service"
version = "0.1.1-rc.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Service layer for ZK proof generation and key management"
repository = "https://github.com/snp-labs/zkap-circuit"
keywords = ["zk", "proof-generation", "groth16"]
categories = ["cryptography"]

[dependencies]
# --- Always required (lightweight, WASM-compatible) ---
gadget = { workspace = true, default-features = false }
circuit = { workspace = true, default-features = false, features = ["types"] }
ark-codec = { workspace = true, features = ["field-serde"] }

thiserror = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }

ark-ff                = { workspace = true }
ark-std               = { workspace = true, optional = true }
ark-crypto-primitives = { workspace = true, features = ["crh"] }
ark-bn254             = { workspace = true }
hex = { workspace = true }
# Always-on: `manifest` module needs sha2 (ceremony chain_hash,
# compute_circuit_tag) and must stay proof-feature-independent so light
# bindings can depend on it cheaply. The runtime cost of pulling sha2
# unconditionally is negligible.
sha2 = { workspace = true, optional = true }
# Manifest signing (F5 soft-enforce policy). `manifest` module exposes
# `sign_manifest` / `verify_manifest`; `ArtifactSet::load` calls
# `verify_manifest` when the caller supplies a `VerifyingKey`. Stays
# proof-feature-independent (no ark-* coupling).
ed25519-dalek = { workspace = true, optional = true }

# --- Proof / Groth16 dependencies. These are feature-gated so SDK hosts
#     can use host-primitives and artifact-loader without native
#     constraint synthesis.
zkap-evm-verifier     = { workspace = true, optional = true }
ark-ec                = { workspace = true, optional = true }
ark-groth16           = { workspace = true, optional = true }
ark-poly              = { workspace = true, optional = true }
ark-r1cs-std          = { workspace = true, optional = true }
ark-relations         = { workspace = true, optional = true }
ark-serialize         = { workspace = true, optional = true }
rand                  = { workspace = true, optional = true }
rand_chacha           = { workspace = true, optional = true }
# Data parallelism for the native per-bundle prove loop. Optional and
# enabled ONLY by `native-witness`, so the wasm32 `host-primitives`
# build never links rayon (its threadpool is incompatible with wasm).
rayon                 = { workspace = true, optional = true }
# Native prove flow. The `ark-ar1cs` root crate exposes
# `PreparedArcs`, `prove_with_mode`, `synthesize_full_assignment`, and
# the `format::ArcsFile` envelope that `ArtifactSet` loads from
# `circuit.ar1cs`.
ark-ar1cs              = { workspace = true, optional = true }

[dev-dependencies]
signature = { workspace = true }
ark-std = { workspace = true }
rsa = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
ark-relations = { workspace = true }
circuit = { workspace = true, features = ["constraints"] }
proptest = { workspace = true }
serde_json = { workspace = true }
# Enable the `testing` feature when building test binaries so that
# integration tests in `tests/` can call `SetupOutput::into_artifact_set`.
zkap-service = { path = ".", features = ["testing"] }

[lib]
name = "zkap_service"
crate-type = ["staticlib", "cdylib", "rlib"]

# `crates/service/examples/` is empty today. The end-to-end exercise
# of `service::prove` lives in
# `crates/service/tests/native_prove_e2e.rs` (signature guards) and
# the slow `circuit::tests::groth16_integration` suite.

[features]
default = ["native-prove", "setup"]
host-primitives = [
    "gadget/hashes-poseidon",
    "gadget/anchor",
    "gadget/base64",
    "gadget/rsa",
]
manifest = ["dep:sha2", "dep:ed25519-dalek"]
proof-types = ["dep:ark-groth16", "dep:ark-serialize", "dep:zkap-evm-verifier"]
artifact-loader = [
    "manifest",
    "proof-types",
    "dep:ark-ar1cs",
    "dep:sha2",
]
native-witness = [
    "host-primitives",
    "proof-types",
    "circuit/constraints",
    "gadget/full",
    "dep:ark-ar1cs",
    "dep:ark-ec",
    "dep:ark-r1cs-std",
    "dep:ark-relations",
    "dep:ark-std",
    "dep:rand",
    "dep:rayon",
]
native-prove = ["artifact-loader", "native-witness"]
# Internal, non-default feature: re-export
# `synthesize_witnesses_streaming` (the low-memory witness pipeline
# entry) from the crate root. This is NOT part of the semver-stable
# public boundary — it exists only so the in-workspace
# `zkap-witness-gen-wasm` crate can drive the streaming path. External
# native consumers and `zkap-zkp` must NOT enable it; they use
# `synthesize_witnesses` / `prove_bundles` instead. Requires the witness
# pipeline (`native-witness`) to be active.
internal-streaming-witness = ["native-witness"]
setup = [
    "native-prove",
    "dep:ark-poly",
    "dep:rand_chacha",
]
print-trace = ["native-witness", "circuit/print-trace"]
# Enables `SetupOutput::into_artifact_set` — a convenience that converts
# a freshly-built `SetupOutput` into an `ArtifactSet` in memory without
# going through disk.  Bypasses the manifest hash-check trust gate, so it
# must ONLY be used in tests / CI tooling, never in production code paths.
testing = ["setup"]

# Example temporarily disabled — see comment above the [features] block.
# [[example]]
# name = "groth16_proof"

[lints]
workspace = true
