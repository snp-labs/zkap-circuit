[package]
name = "circuit"
version = "0.1.1-rc.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "ZK circuit implementation for JWT/OAuth proof generation with Groth16"
repository = "https://github.com/snp-labs/zkap-circuit"
keywords = ["zk", "groth16", "jwt", "oauth", "circuit"]
categories = ["cryptography"]

[dependencies]
gadget = { workspace = true, default-features = false, features = ["hashes-poseidon", "rsa"] }
ark-r1cs-helpers = { workspace = true, optional = true }

ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-r1cs-std = { workspace = true, optional = true }
ark-relations = { workspace = true, optional = true }
ark-std = { workspace = true }
ark-crypto-primitives = { workspace = true, features = ["crh", "merkle_tree"] }
ark-bn254 = { workspace = true }
ark-ed-on-bn254 = { workspace = true }
ark-serialize = { workspace = true, features = ["derive"] }

serde = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["constraints"]
types = []
constraints = [
    "types",
    "dep:ark-r1cs-helpers",
    "dep:ark-r1cs-std",
    "dep:ark-relations",
    "ark-crypto-primitives/constraints",
    "ark-ed-on-bn254/r1cs",
    "gadget/base64",
    "gadget/crypto",
    "gadget/constraints",
]
print-trace = ["constraints", "gadget/print-trace"]
# Marker feature gating the heavy Groth16 integration test target.
# Renamed from `zkap-circuit` (Phase 5 / C13) — old name collided with the
# crate name itself and confused tooling like `clippy --all-features`.
integration-tests = ["constraints"]

[dev-dependencies]
# Integration tests under `tests/groth16_integration.rs` exercise the
# real Groth16 prove/verify path against the circuit; move these deps
# from `[dependencies]` so the rlib's runtime surface stays minimal.
ark-groth16 = { workspace = true }
ark-poly = { workspace = true }
ark-codec = { workspace = true, features = ["field-serde"] }
hex = { workspace = true }
serde_json = { workspace = true }
rsa = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }

[[test]]
name = "groth16_integration"
required-features = ["integration-tests"]

[lints]
workspace = true
